# Оверрайд для корп. машины (VDI) — заменяет публичные образы на Harbor.
# Запуск: docker compose -f docker-compose.yml -f docker-compose.corp.yml up -d --build
#
# Предварительно:
#   cd frontend && cp .npmrc.corp .npmrc
#

services:
  postgres:
    image: harbor.mgts.ru/dockerhub/library/postgres:16.4

  redis:
    image: harbor.mgts.ru/it/rnd/llm-eval/redis:7.2.13-alpine
    command: redis-server --save "" --appendonly no --dir /tmp

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.corp

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.corp

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.corp.Dockerfile
