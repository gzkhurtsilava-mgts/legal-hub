# Оверрайд для корп. машины (VDI) — заменяет публичные образы на Harbor.
# Запуск: docker compose -f docker-compose.yml -f docker-compose.corp.yml up -d --build
#
# Предварительно:
#   cd frontend && cp .npmrc.corp .npmrc
#
# ВАЖНО: перед первым запуском проверь доступный тег valkey в Harbor:
#   curl -sk https://harbor.mgts.ru/v2/dockerhub/valkey/valkey/tags/list
# и замени тег в строке image: ниже.

services:
  postgres:
    image: harbor.mgts.ru/dockerhub/library/postgres:16.4

  redis:
    # valkey — Redis-совместимый форк, работает с redis==5.2.1 Python-клиентом без изменений.
    # Замени тег на тот, что есть в Harbor (проверь командой выше).
    image: harbor.mgts.ru/dockerhub/valkey/valkey:8.0-alpine

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.corp

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.corp

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.corp.Dockerfile
