version: "3.9"

services:
  # База данных
  postgres:
    image: postgres:16.4
    container_name: legal-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legalhub}
      POSTGRES_USER: ${POSTGRES_USER:-legalhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legalhub_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legalhub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Кэш и очереди
  redis:
    image: redis:7.4-alpine
    container_name: legal-hub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Office → PDF конвертер (LibreOffice headless, REST) — для конструктора доверенностей
  jodconverter:
    image: eugenmayer/jodconverter:rest-0.2.0
    container_name: legal-hub-jod
    restart: unless-stopped
    expose:
      - "8080"

  # FastAPI бэкенд
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal-hub-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-legalhub}:${POSTGRES_PASSWORD:-legalhub_dev}@postgres:5432/${POSTGRES_DB:-legalhub}
      REDIS_URL: redis://redis:6379
      MEDIA_ROOT: /media
      JODCONVERTER_URL: http://jodconverter:8080
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media_storage:/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # arq worker (фоновые задачи)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal-hub-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-legalhub}:${POSTGRES_PASSWORD:-legalhub_dev}@postgres:5432/${POSTGRES_DB:-legalhub}
      REDIS_URL: redis://redis:6379
      MEDIA_ROOT: /media
      JODCONVERTER_URL: http://jodconverter:8080
    volumes:
      - ./backend:/app
      - media_storage:/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq app.worker.WorkerSettings

  # Next.js фронтенд
  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
    container_name: legal-hub-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BACKEND_INTERNAL_URL: http://backend:8000
      # Числовое значение = интервал опроса в мс (watchpack), вместо "true" с частым опросом.
      WATCHPACK_POLLING: "2000"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
      # vendor/@mts-ds — 12 500 файлов, которые не меняются. На bind-mount из OneDrive
      # их обход занимает ~100 с и тормозит любую компиляцию. Берём их из образа
      # (frontend.Dockerfile: COPY vendor/ vendor/) через анонимный том.
      # После обновления @mts-ds с корп-машины нужен пересбор образа.
      - /app/vendor
    depends_on:
      - backend

volumes:
  postgres_data:
  media_storage:
